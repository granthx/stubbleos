[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "stubbleos"
version = "0.1.0"
description = "Multi-agent coordination layer for crop-residue management (simulation-first MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "geoalchemy2>=0.15",
  "redis>=5.0.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "groq>=1.7.0",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0", "langchain-core>=0.3"]
optimization = ["ortools>=9.10"]
geo = ["geopandas>=0.14", "shapely>=2.0", "rasterio>=1.3", "pystac-client>=0.8", "httpx>=0.27"]
sim = ["simpy>=4.1", "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8"]
jobs = ["arq>=0.26"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stubbleos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: needs live Postgres/PostGIS and/or Redis (deselected by default)"]
filterwarnings = ["error::DeprecationWarning:stubbleos.*"]

[tool.coverage.run]
source = ["stubbleos"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "S", "N", "PLW"]
ignore = ["E501", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/stubbleos/data/migrations/**" = ["N999", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["stubbleos"]

[[tool.mypy.overrides]]
# ORM models, migrations and the thin API layer are typed but not held to the strictest generics rules.
module = ["stubbleos.data.*", "stubbleos.api.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "ortools.*", "rasterio.*", "pystac_client.*", "geopandas.*", "simpy.*", "langgraph.*", "scipy.*", "shapely.*"]
ignore_missing_imports = true
ignore_errors = true
