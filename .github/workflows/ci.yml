name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: {POSTGRES_USER: stubbleos, POSTGRES_PASSWORD: stubbleos, POSTGRES_DB: stubbleos}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stubbleos" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      STUBBLEOS_DATABASE_URL: postgresql+psycopg://stubbleos:stubbleos@localhost:5432/stubbleos
      STUBBLEOS_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -m integration -o addopts="-ra --strict-markers"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stubbleos:ci .
